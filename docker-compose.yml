services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network

  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Rotio_lempuyangan2026"
      MYSQL_DATABASE: "arxiva"
      MYSQL_USER: "admin"
      MYSQL_PASSWORD: "arxiva123"
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network

  backend:
    image: ghcr.io/rakhathegreat/arxiva-backend:latest
    env_file:
      - .env
    container_name: backend
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      DATABASE_URL: "mysql://admin:arxiva123@mariadb:3306/arxiva"
      NODE_ENV: "production"
      PORT: "3000"
      ENABLE_SWAGGER: "true"
    expose:
      - "3000"
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "minioadminpassword"
      MINIO_BROWSER_REDIRECT_URL: "https://api-taslim.duckdns.org/minio-console"
      MINIO_SERVER_URL: "https://api-taslim.duckdns.org/minio"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:
  mariadb_data:
  minio_data:

networks:
  app-network:
    driver: bridge
